[package]
name = "cadspec"
version = "0.1.0-beta.4"
edition = "2021"
description = "CAD as code — deterministic geometry engine for reproducible CAD drawings"
license = "MIT"
homepage = "https://univerlab.org/cadspec/"
repository = "https://github.com/UniverLab/cadspec"
publish = true
exclude = ["crates/**"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
dxf = "0.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
indexmap = { version = "2", features = ["serde"] }
notify = "6.1"
resvg = "0.48"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
